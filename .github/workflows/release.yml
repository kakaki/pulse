# Publishes a GitHub Release when a version tag is pushed.
# The DMG is built, signed and notarized locally by release.sh and committed to updates/.
# Release notes come from the annotated tag message.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actions/checkout replaces annotated tags with lightweight ones, which would lose the notes.
      - run: git fetch --force --tags origin
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          dmg="updates/Pulse-${TAG#v}.dmg"
          test -f "$dmg" || { echo "::error::Missing $dmg"; exit 1; }
          gh release create "$TAG" "$dmg" --title "Pulse ${TAG#v}" --notes-from-tag --verify-tag
